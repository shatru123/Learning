services:
  - type: web
    name: learning-os-web
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: learning-os-postgres
          property: connectionString
      - key: DOTNET_PRINT_TELEMETRY_MESSAGE
        value: "false"

databases:
  - name: learning-os-postgres
    plan: standard
    region: oregon
    databaseName: learningos
    user: learningos_admin
